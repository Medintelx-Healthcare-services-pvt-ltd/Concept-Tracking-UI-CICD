name: Build and Deploy Angular UI

on:
  push:
    branches:
      - main
      - QA
      - phase-2
  pull_request:
    branches:
      - QA

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Add Git to PATH
        shell: powershell
        run: |
          $gitDir = "C:\Users\hkasoji\AppData\local\Programs\Git\Cmd"
          if (Test-Path "$gitDir\git.exe") {
              Add-Content -Path $env:GITHUB_PATH -Value $gitDir 
              Write-Host "Added $gitDir to PATH for remaining steps."
          } else { 
          Write-Host "git.exe not found at $gitDir - check the install path." 
          exit 1 
          }
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Node.js is available
        run: node --version

      - name: Verify npm is available
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --configuration production

  deploy:
    needs: build
    if: github.ref == 'refs/heads/QA' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Add Git to PATH
        # Must run BEFORE checkout. actions/checkout probes for a working
        # `git` on PATH; if it can't find one it silently falls back to
        # downloading the repo as a tarball via the API instead of doing a
        # real `git clone` - which produces a workspace with files but NO
        # .git folder. Nothing later in this job shells out to `git`
        # directly (version bump and tagging go through the GitHub REST
        # API instead), so this isn't currently load-bearing here - but
        # it keeps this workflow consistent with the backend one and
        # avoids the same failure mode if a git-based step gets added
        # later. If this runner is registered as a Windows service, the
        # service account's PATH may not include git even though it's on
        # PATH for an interactive user session.
        shell: powershell
        run: |
          $gitDir = "C:\Users\hkasoji\AppData\Local\Programs\Git\cmd"
          if (Test-Path "$gitDir\git.exe") {
              Add-Content -Path $env:GITHUB_PATH -Value $gitDir
              Write-Host "Added $gitDir to PATH for remaining steps."
          } else {
              Write-Host "git.exe not found at $gitDir - check the install path."
              exit 1
          }

      - name: Checkout latest QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $api = "https://api.github.com"
          $headers = @{
              Authorization          = "Bearer $env:GITHUB_TOKEN"
              Accept                 = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $output = node scripts/update-version.js
          Write-Host $output

          if ($output -match 'Version updated to (\d+\.\d+\.\d+)') {
            $major, $minor, $patch = $Matches[1].Split('.')
            $major = [int]$major; $minor = [int]$minor; $patch = [int]$patch
          }
          else {
            Write-Error "Could not parse version from update-version.js output"
            exit 1
          }

          $filePath = "src/environments/version.ts"

          # If this tag already exists on GitHub, keep bumping the patch
          # number and rewriting version.ts until we find one that's free.
          while ($true) {
            $candidate = "v$major.$minor.$patch"
            $checkUri = "$api/repos/$env:REPO/git/ref/tags/$candidate"

            try {
              Invoke-RestMethod -Uri $checkUri -Headers $headers -ErrorAction Stop | Out-Null
              Write-Host "$candidate already exists, trying next patch..."
              $patch++

              $content = Get-Content $filePath -Raw
              $content = $content -replace "version:\s*['`"]\d+\.\d+\.\d+['`"]", "version: '$major.$minor.$patch'"
              Set-Content -Path $filePath -Value $content -NoNewline
            }
            catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) {
                Write-Host "$candidate is available."
                break
              }
              else {
                Write-Error "Unexpected error checking tag: $($_.Exception.Message)"
                exit 1
              }
            }
          }

          $newVersion = "v$major.$minor.$patch"
          Write-Host "Final version: $newVersion"
          "NEW_VERSION=$newVersion" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --configuration production

      - name: Copy web.config into build output
        shell: powershell
        run: |
          Copy-Item `
            -Path "$env:GITHUB_WORKSPACE\web.config" `
            -Destination "$env:GITHUB_WORKSPACE\dist\Concept-Tracking\browser\web.config" `
            -Force

      - name: Stop IIS app pool before file copy
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPool = "CONCEPT-TRACKING-UI-CICD"

          if ((Get-WebAppPoolState -Name $appPool).Value -eq "Started") {
            Stop-WebAppPool -Name $appPool

            Write-Host "App pool stopped"

            Start-Sleep -Seconds 5
          }
          else {
            Write-Host "App pool already stopped, continuing..."
          }

      - name: Copy Angular build to IIS folder
        shell: powershell
        run: |
          robocopy `
            "$env:GITHUB_WORKSPACE\dist\Concept-Tracking\browser" `
            "C:\apps\concept-tracking-CICD\ui" `
            /MIR

          if ($LASTEXITCODE -ge 8) {
            exit 1
          }
          else {
            exit 0
          }

      - name: Start IIS app pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Start-WebAppPool -Name "CONCEPT-TRACKING-UI-CICD"

      - name: Wait for app to become healthy
        shell: powershell
        run: |
          $maxAttempts = 30
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxAttempts) {
            $attempt++

            try {
              $response = curl.exe `
                -k `
                -s `
                -o NUL `
                -w "%{http_code}" `
                https://localhost:8400/

              if ($response -eq "200") {
                Write-Host "Application is healthy after $attempt attempts."

                $success = $true
                break
              }
            }
            catch {
            }

            Write-Host "Attempt $attempt/$maxAttempts - waiting 5 seconds..."

            Start-Sleep -Seconds 5
          }

          if (-not $success) {
            Write-Host "Application failed health check."
            exit 1
          }

      - name: Tag release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $api = "https://api.github.com"
          $headers = @{
              Authorization          = "Bearer $env:GITHUB_TOKEN"
              Accept                 = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{ ref = "refs/tags/$env:NEW_VERSION"; sha = $env:DEPLOY_SHA } | ConvertTo-Json

          try {
              Invoke-RestMethod -Method Post -Uri "$api/repos/$env:REPO/git/refs" `
                  -Headers $headers -Body $body -ContentType "application/json"
              Write-Host "Created tag $env:NEW_VERSION on commit $env:DEPLOY_SHA"
          }
          catch {
              Write-Host "Failed to create tag: $($_.Exception.Message)"
              if ($_.ErrorDetails) { Write-Host $_.ErrorDetails.Message }
              exit 1
          }

      - name: Commit version bump back to QA
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $api = "https://api.github.com"
          $headers = @{
              Authorization          = "Bearer $env:GITHUB_TOKEN"
              Accept                 = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $filePath = "src/environments/version.ts"
          $localContent = Get-Content $filePath -Raw
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($localContent))

          # Need the current file's blob sha on QA before we can overwrite it
          $fileInfo = Invoke-RestMethod -Uri "$api/repos/$env:REPO/contents/$filePath`?ref=QA" -Headers $headers

          $body = @{
              message = "chore: bump version to $env:NEW_VERSION [skip ci]"
              content = $encoded
              sha     = $fileInfo.sha
              branch  = "QA"
          } | ConvertTo-Json

          try {
              Invoke-RestMethod -Method Put -Uri "$api/repos/$env:REPO/contents/$filePath" `
                  -Headers $headers -Body $body -ContentType "application/json"
              Write-Host "Committed version.ts bump ($env:NEW_VERSION) back to QA"
          }
          catch {
              Write-Host "Failed to commit version bump: $($_.Exception.Message)"
              if ($_.ErrorDetails) { Write-Host $_.ErrorDetails.Message }
              exit 1
          }

      - name: Package deploy artifact
        # Zips the exact build output that was just deployed to IIS, so
        # the release asset matches what's actually running - same
        # pattern as the backend workflow's release zip.
        shell: powershell
        run: |
          $zip = "$env:RUNNER_TEMP\ConceptTrackingUI-$env:NEW_VERSION.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\Concept-Tracking\browser\*" -DestinationPath $zip -Force
          Write-Host "Packaged $zip"

          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          generate_release_notes: true
          body: |
            Release of ${{ env.NEW_VERSION }}

            Commit: ${{ github.sha }}

            `ConceptTrackingUI-${{ env.NEW_VERSION }}.zip` is the exact build deployed to the
            development environment. Deploy this artifact for UAT - do not use the
            auto-generated "Source code" zip, its version is stale.
          files: ${{ env.RELEASE_ZIP }}
          

@if (loading) {
  <div class="loader-overlay">
    <img src="/Images/loader.gif" alt="Loading..." />
  </div>
}
<div class="login-wrapper">
  <div class="login-container">
    <div class="login-left">
      <div class="image-background">
        <img src="Images/medreview_logo.png" class="image-logo" alt="Logo" />
        <!-- <img src="Images/medreview_logo.png" class="image-logo" alt="Logo" /> -->
      </div>
    </div>
    <div class="login-right">
      <h2>Sign in to Concept Tracker</h2>

      <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <!-- <p class="select-label">Select Client</p> -->

        <!-- <div class="form-group icon-inside">
          <div class="input-wrapper">
            <img src="Images/user.png" alt="Client Icon" class="input-icon" />
            <select id="client" formControlName="client" [disabled]="true">
              <option value="">Client</option>
              <option *ngFor="let client of clients" [value]="client.name">
                {{ client.name }}
              </option>
            </select>
            <img src="Images/down.png" alt="Dropdown" class="dropdown-arrow" />
          </div>
          <div
            *ngIf="
              loginForm.controls['client'].invalid &&
              (loginForm.controls['client'].dirty || submitted)
            "
            class="form-error"
          >
            Client selection is required.
          </div>
        </div> -->

        <div class="sso-container">
          <button type="submit" class="sso-btn ms-btn" [disabled]="isLogin">
            @if (isLogin) {
              <span class="ms-spinner"></span>
            } @else {
              <svg
                class="sso-icon ms-icon"
                viewBox="0 0 21 21"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <rect x="1" y="1" width="9" height="9" fill="#F25022" />
                <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
                <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
                <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
              </svg>
            }

            {{ isLogin ? 'Signing in...' : 'Continue with Microsoft' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
